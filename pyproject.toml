[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_ids"
version = "0.1.0"
description = "Federated feature selection + sliding-window IDS on CICIoMT2024"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "xgboost", "pyyaml", "tqdm"]

[tool.setuptools]
packages = ["fl_ids"]
